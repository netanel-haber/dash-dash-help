name: vllm GPU --help

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: "cirun-vllm-gpu--${{ github.run_id }}"
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Install system dependencies
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt update
          $SUDO apt install -y --no-install-recommends ca-certificates curl git python3 python3-venv

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Probe GPU
        run: |
          nvidia-smi

      - name: Install vllm
        id: version
        run: |
          uv venv --python python3
          uv pip install vllm
          echo "v=$(uv pip show vllm | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Benchmark and update
        run: |
          python3 work.py ".venv/bin/vllm --help" \
            --library vllm \
            --version "${{ steps.version.outputs.v }}" \
            --version-url "https://github.com/vllm-project/vllm/releases/tag/v${{ steps.version.outputs.v }}"
