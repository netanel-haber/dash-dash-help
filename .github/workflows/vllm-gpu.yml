name: vllm Vast GPU --help

on:
  workflow_dispatch:
    inputs:
      max_price:
        description: "Max GPU price $/hour"
        required: true
        default: "0.10"
      offer_query:
        description: "Vast search query"
        required: true
        default: "gpu_arch=nvidia num_gpus=1 compute_cap>=750 gpu_ram>=8 cuda_vers>=12.1 reliability>0.90 inet_down>50 direct_port_count>=1 rented=false verified=true"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      VAST_DISK_GB: "100"
      VAST_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install tools
        run: |
          test -n "$VAST_API_KEY"
          sudo apt update
          sudo apt install -y --no-install-recommends jq openssh-client
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install vastai
          export PATH="$HOME/.local/bin:$PATH"
          vastai --version

      - name: Create SSH key
        id: ssh_key
        run: |
          key="$RUNNER_TEMP/vast_key"
          ssh-keygen -t ed25519 -f "$key" -N "" -C "dash-dash-help-${GITHUB_RUN_ID}"
          chmod 600 "$key"
          echo "private=$key" >> "$GITHUB_OUTPUT"
          echo "public=$key.pub" >> "$GITHUB_OUTPUT"

      - name: Rent Vast instance
        id: rent
        run: |
          python3 .github/scripts/rent_vast_instance.py \
            --query "${{ inputs.offer_query }}" \
            --max-price "${{ inputs.max_price }}" \
            --disk-gb "$VAST_DISK_GB" \
            --image "$VAST_IMAGE" \
            --label "dash-dash-help-vllm-${GITHUB_RUN_ID}" \
            --ssh-public-key "${{ steps.ssh_key.outputs.public }}"

      - name: Wait for SSH
        id: ssh
        run: |
          instance_id="${{ steps.rent.outputs.instance_id }}"

          for _ in $(seq 1 90); do
            info=$(vastai --raw show instance "$instance_id" || true)
            echo "$info" | jq . || true
            actual_status=$(echo "$info" | jq -r '.actual_status // empty' 2>/dev/null || true)
            intended_status=$(echo "$info" | jq -r '.intended_status // empty' 2>/dev/null || true)
            if [ "$actual_status" = "running" ] && [ "$intended_status" = "running" ]; then
              break
            fi
            sleep 10
          done

          test "$actual_status" = "running"
          test "$intended_status" = "running"

          host=$(echo "$info" | jq -r '.ssh_host // .public_ipaddr // empty')
          port=$(echo "$info" | jq -r '.ssh_port // .ports["22/tcp"][0].HostPort // empty')
          test -n "$host"
          test -n "$port"
          echo "SSH target: root@$host:$port"

          key="${{ steps.ssh_key.outputs.private }}"
          for _ in $(seq 1 60); do
            if ssh -i "$key" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "root@$host" "echo ok"; then
              echo "host=$host" >> "$GITHUB_OUTPUT"
              echo "port=$port" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          exit 1

      - name: Benchmark on Vast
        id: remote_benchmark
        run: |
          key="${{ steps.ssh_key.outputs.private }}"
          host="${{ steps.ssh.outputs.host }}"
          port="${{ steps.ssh.outputs.port }}"

          ssh -i "$key" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$host" 'bash -s' <<'REMOTE'
          set -euxo pipefail
          cd /root
          nvidia-smi
          python -m pip install --upgrade uv
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python python3 /root/vllm-venv
          uv pip install --python /root/vllm-venv/bin/python vllm
          version=$(/root/vllm-venv/bin/python -m pip show vllm | awk '/^Version:/ {print $2}')
          /root/vllm-venv/bin/python - "$version" <<'PY' > /tmp/vllm_result.json
          import json
          import subprocess
          import sys
          import time

          version = sys.argv[1]
          command = ["/root/vllm-venv/bin/vllm", "--help"]
          times: list[int] = []
          for _ in range(11):
              start = time.perf_counter_ns()
              proc = subprocess.run(command, capture_output=True, text=True)
              elapsed_ms = (time.perf_counter_ns() - start) // 1_000_000
              if proc.returncode != 0:
                  print(proc.stdout, file=sys.stderr)
                  print(proc.stderr, file=sys.stderr)
                  raise SystemExit(proc.returncode)
              times.append(elapsed_ms)

          print(json.dumps({
              "version": version,
              "cold_ms": times[0],
              "warm_ms": sum(times[1:]) // 10,
              "times": times,
          }))
          PY
          cat /tmp/vllm_result.json
          REMOTE

          scp -i "$key" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$host:/tmp/vllm_result.json" "$RUNNER_TEMP/vllm_result.json"
          cat "$RUNNER_TEMP/vllm_result.json" | jq .
          echo "result=$RUNNER_TEMP/vllm_result.json" >> "$GITHUB_OUTPUT"

      - name: Destroy Vast instance
        if: always() && steps.rent.outputs.instance_id != ''
        run: |
          vastai destroy instance "${{ steps.rent.outputs.instance_id }}" || true

      - name: Update dashboard
        if: steps.remote_benchmark.outcome == 'success'
        run: |
          result="${{ steps.remote_benchmark.outputs.result }}"
          version=$(jq -r '.version' "$result")
          cold_ms=$(jq -r '.cold_ms' "$result")
          warm_ms=$(jq -r '.warm_ms' "$result")
          python3 work.py "vastai:vllm --help" \
            --library vllm \
            --version "$version" \
            --version-url "https://github.com/vllm-project/vllm/releases/tag/v${version}" \
            --cold-ms "$cold_ms" \
            --warm-ms "$warm_ms"
